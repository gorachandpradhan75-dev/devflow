server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Static dashboard
    location / {
        try_files $uri /index.html;
    }

    # API calls are proxied to the backend container over the Docker network,
    # so the browser only talks to one origin and CORS is not needed.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
